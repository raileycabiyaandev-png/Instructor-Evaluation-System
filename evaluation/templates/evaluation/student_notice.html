{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} — Student Portal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        :root {
            --navy-900: #0b1229;
            --navy-800: #0f1d40;
            --navy-600: #1e3163;
            --gold: #c9a84c;
            --gold-lt: #e8c97a;
            --font-serif: 'Playfair Display', Georgia, serif;
            --font-sans: 'Source Sans 3', system-ui, sans-serif;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 24px;
            font-family: var(--font-sans);
            background: #f7f8fc;
            color: #334155;
        }
        .notice-card {
            width: 100%; max-width: 480px;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 40px 32px 32px;
            text-align: center;
            box-shadow: 0 12px 36px rgba(6, 9, 26, 0.10);
            position: relative; overflow: hidden;
        }
        .notice-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, var(--gold), var(--gold-lt));
        }
        .notice-icon {
            width: 68px; height: 68px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 18px; font-size: 30px;
        }
        .tone-danger  .notice-icon { background: #fee2e2; color: #b91c1c; }
        .tone-warning .notice-icon { background: #fef3c7; color: #b45309; }
        .tone-success .notice-icon { background: #dcfce7; color: #15803d; }

        h1 { font-family: var(--font-serif); font-size: 24px; color: var(--navy-800); margin-bottom: 10px; }
        .teacher-name { font-weight: 700; color: var(--navy-800); margin-bottom: 8px; }
        p { font-size: 14.5px; line-height: 1.6; color: #64748b; }

        .back-btn {
            display: inline-flex; align-items: center; gap: 8px;
            margin-top: 26px; padding: 11px 24px; border-radius: 8px;
            background: linear-gradient(135deg, var(--navy-800), var(--navy-600));
            color: #fff; text-decoration: none; font-size: 13.5px; font-weight: 600;
            box-shadow: 0 3px 10px rgba(11, 18, 41, 0.22);
        }
        .back-btn:hover { opacity: 0.9; color: #fff; }
    </style>
</head>
<body>
    <div class="notice-card tone-{{ tone }}">
        <div class="notice-icon"><i class="bi {{ icon }}"></i></div>
        <h1>{{ title }}</h1>
        {% if teacher_name %}<div class="teacher-name">{{ teacher_name }}</div>{% endif %}
        <p>{{ message }}</p>
        <a href="{% url 'student_dashboard' %}" class="back-btn">
            <i class="bi bi-arrow-left"></i> Back to Dashboard
        </a>
    </div>
</body>
</html>
